name: Publicar atualização do aplicativo

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão que será publicada (exemplo: 1.2.22)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ranchao-bebidas-desktop/package-lock.json

      - name: Conferir arquivos do site e aplicativo
        shell: pwsh
        run: |
          $indexRaiz = (Get-FileHash "index.html" -Algorithm SHA256).Hash
          $indexApp = (Get-FileHash "ranchao-bebidas-desktop/index.html" -Algorithm SHA256).Hash
          $rendererRaiz = (Get-FileHash "renderer.js" -Algorithm SHA256).Hash
          $rendererApp = (Get-FileHash "ranchao-bebidas-desktop/renderer.js" -Algorithm SHA256).Hash
          if ($indexRaiz -ne $indexApp) { throw "index.html da raiz e do aplicativo estão diferentes. Atualize os dois arquivos antes de publicar." }
          if ($rendererRaiz -ne $rendererApp) { throw "renderer.js da raiz e do aplicativo estão diferentes. Atualize os dois arquivos antes de publicar." }

      - name: Definir versão
        working-directory: ranchao-bebidas-desktop
        run: npm version "${{ inputs.versao }}" --no-git-tag-version --allow-same-version

      - name: Instalar dependências
        working-directory: ranchao-bebidas-desktop
        run: npm ci

      - name: Gerar instalador
        working-directory: ranchao-bebidas-desktop
        run: npm run build:windows -- --publish never

      - name: Publicar versão no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.versao }}
          name: Ranchão Bebidas v${{ inputs.versao }}
          generate_release_notes: true
          files: |
            ranchao-bebidas-desktop/dist/*.exe
            ranchao-bebidas-desktop/dist/*.blockmap
            ranchao-bebidas-desktop/dist/latest.yml

